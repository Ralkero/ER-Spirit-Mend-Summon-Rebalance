[SpiritAsh]
; Experimental duplicate groups; existing heal-on-reuse remains the default.
AllowDuplicateAshGroups = false
MaxGroupsPerAsh = 3
AllowMultipleAshTypes = true
AllowResummoning = true
HealOnReuse = true
HealPercentage = 25.0
PreserveSummoningRestrictions = true
RequireNormalResourceCost = true

[Debug]
EnableLogging = false
EnableTargetDiagnostics = false


[HUD]
EnableGroupHud = false
OffsetX = -91.0
OffsetY = -350.0
RowSpacing = 45.0
Scale = 0.82

[Targeting]
EnableFriendlySpiritLockOn = false

[Sorcery]
EnableSpiritMend = false
